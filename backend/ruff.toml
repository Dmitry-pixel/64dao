# ── ruff: единственный линтер бэкенда ────────────────────────────────────────
# Прод работает на Python 3.11 (backend/Dockerfile: FROM python:3.11-bullseye).
# target-version обязан совпадать, иначе ruff предложит автофикс с синтаксисом,
# которого в 3.11 нет, и контейнер упадёт на старте.
target-version = "py311"
line-length = 120

[lint]
# E501 указан отдельным кодом, а не группой E5: E502 (лишний backslash внутри
# скобок) к длине строки отношения не имеет.
select = ["E4", "E7", "E9", "E501", "F", "B", "ASYNC", "SIM", "UP", "I"]

ignore = [
  # ── Норма для этого проекта, не долг ──────────────────────────────────────
  "B008",   # Depends() в значении по умолчанию — идиома FastAPI
  "E712",   # == True: в фильтрах SQLAlchemy это генерация SQL, а не сравнение
  "UP009",  # coding: utf-8 в шапке — безвредно

  # ── Этап 2: разобрать отдельно, каждое требует ручной проверки ────────────
  "E741",   # ambiguous-variable-name: l/I/O (56)
  "E701", "E702",  # несколько инструкций в одной строке (25)
]

# Пути в exclude обязаны быть glob-шаблонами: строка "alembic/versions" ruff-ом
# не исключается, и миграции проверялись наравне с кодом.
exclude = [".venv", "venv", "__pycache__", "**/alembic/versions/**", "**/migrations/**"]

[lint.per-file-ignores]
# Модули-реэкспорты: имена импортируются ради обратной совместимости и внешне
# выглядят неиспользуемыми. Автофикс F401 их удаляет, а isort (I001) разрывает
# блок импорта так, что построчный `# noqa: F401` перестаёт покрывать хвост —
# в паре это ломает импорт приложения. Отключено пофайлово, а не комментарием.
"app/finance_scoring.py" = ["F401", "I001"]
"app/contour_summary.py" = ["F401", "I001"]
"app/contour_route.py"   = ["F401", "I001"]
"app/email.py"           = ["F401", "I001"]
"app/routers/admin.py"   = ["I001"]  # строка 565: реэкспорт под построчным noqa, isort разрывает блок

# ── E501: файлы, где длинная строка — это данные, а не код ───────────────────
# Тексты методики, справочники и HTML-шаблоны. Перенос литерала не улучшает
# чтение, а риск задеть содержание при переносе — реальный. Ограничение в 120
# символов продолжает действовать для всего остального кода.
"seed_m3.py" = ["E501"]
"seed_lifecycle_playbooks.py" = ["E501"]
"seed_fin_content.py" = ["E501"]
"app/contours.py" = ["E501"]
"app/finance_pdf.py" = ["E501"]
"app/finance_items.py" = ["E501"]
"app/finance_interpret.py" = ["E501"]
"app/level_state_texts.py" = ["E501"]
"app/method1_questions.py" = ["E501"]
"app/pricing_store.py" = ["E501"]
"app/m3_pdf.py" = ["E501"]
"app/pdf.py" = ["E501"]

# Объявления колонок выровнены в столбик: имя, тип и mapped_column стоят в
# общих колонках и читаются как таблица схемы. Перенос по 120 символов эту
# таблицу разрушает, поэтому длина здесь не проверяется.
"app/models.py" = ["E501"]
"app/m3_models.py" = ["E501"]

# В тестах фикстуры переопределяют имена, реэкспорты хелперов обычны,
# а блокирующий IO безвреден.
"tests/*" = ["F401", "F811", "B011", "B017", "ASYNC230", "ASYNC240"]
"seed_*.py" = ["E402"]
