[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    live: тест бьёт напрямую в https://64dao.ru (test_sanity.py::TestLiveAPI, test_smoke.py) — требует сеть, не использует dao64_test
