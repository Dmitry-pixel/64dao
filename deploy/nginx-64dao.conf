# /etc/nginx/sites-available/64dao
# Активация: ln -s /etc/nginx/sites-available/64dao /etc/nginx/sites-enabled/

# HTTP → HTTPS редирект
server {
    listen 80;
    server_name 64dao.ru www.64dao.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 64dao.ru www.64dao.ru;

    # SSL (Let's Encrypt — заполняется после certbot)
    ssl_certificate     /etc/letsencrypt/live/64dao.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/64dao.ru/privkey.pem;

    # Современные SSL настройки
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Размер загружаемых файлов (изображения стратегий до 5 МБ)
    client_max_body_size 10M;

    # Логи
    access_log /var/log/nginx/64dao.access.log;
    error_log  /var/log/nginx/64dao.error.log;

    # ── API → FastAPI (порт 8000) ─────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Таймаут для генерации PDF (может занять до 30 сек)
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;

        # Куки сохраняются при проксировании
        proxy_pass_header  Set-Cookie;
    }

    # ── Статические файлы (изображения стратегий) ─────────────────────────────
    location /uploads/ {
        alias      /var/www/64dao/uploads/;
        expires    30d;
        add_header Cache-Control "public, immutable";
        # Запрещаем листинг директорий
        autoindex  off;
    }

    # ── Frontend → Next.js (порт 3000) ───────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js статика — кешируем
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        expires            365d;
        add_header         Cache-Control "public, immutable";
    }
}
