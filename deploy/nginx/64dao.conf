server {
    listen 80;
    server_name 64dao.ru www.64dao.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 64dao.ru www.64dao.ru;

    ssl_certificate     /etc/letsencrypt/live/64dao.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/64dao.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 10M;
    access_log /var/log/nginx/64dao.access.log;
    error_log  /var/log/nginx/64dao.error.log warn;

    location /api {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  Set-Cookie;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        alias      /var/www/64dao/uploads/;
        expires    30d;
        autoindex  off;
    }

    location /_next/static/ {
        proxy_pass http://frontend:3000/_next/static/;
        expires    365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
