name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · ruff + pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dao64_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USER: postgres
      DB_PASS: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: dao64_test
      JWT_SECRET: ci-test-secret-not-for-prod
      ENFORCE_CREDITS: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi
          pip install ruff

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Run tests (пофайлово)
        working-directory: backend
        run: |
          set -o pipefail
          files=$(find . -name 'test_*.py' -path '*test*' | sort)
          if [ -z "$files" ]; then
            echo "::error::Не найдено ни одного test_*.py"; exit 1
          fi
          fail=0
          for f in $files; do
            echo "::group::pytest $f"
            python -m pytest -x -q "$f" || fail=1
            echo "::endgroup::"
          done
          exit $fail

  frontend:
    name: frontend · eslint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npx next lint --max-warnings=9999
