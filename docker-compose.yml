# ============================================================
# 64dao.ru — Docker Compose (production-ready)
# ============================================================
#
# Запуск:
#   docker compose up -d
#
# Остановка с удалением данных:
#   docker compose down -v
#
# Логи:
#   docker compose logs -f backend
#
# ============================================================

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: dao64_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-dao64}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS is required}
      POSTGRES_DB:       ${DB_NAME:-dao64}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
      # init-скрипты запускаются при первом создании БД
      - ./deploy/scripts/pg-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dao64} -d ${DB_NAME:-dao64}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # В production порт НЕ открываем наружу — только через internal сеть
    # Раскомментируйте только для локальной отладки:
    # ports:
    #   - "127.0.0.1:5432:5432"

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dao64_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db          # переопределяем хост для Docker-сети
      DB_PORT: "5432"
    volumes:
      - uploads:/var/www/64dao/uploads
    networks:
      - internal
    depends_on:
      db:
        condition: service_started
    # Порт открыт только внутри Docker-сети (Nginx проксирует снаружи)
    expose:
      - "8000"

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://64dao.ru
    container_name: dao64_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      NODE_ENV:               production
      NEXT_PUBLIC_API_URL:    ${APP_URL:-https://64dao.ru}/api
    networks:
      - internal
    depends_on:
      backend:
        condition: service_started
    expose:
      - "3000"

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: dao64_nginx
    command: >
      sh -c "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/64dao.conf:/etc/nginx/conf.d/64dao.conf:ro
      - uploads:/var/www/64dao/uploads:ro
      - nginx_logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - internal
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && curl -sf http://localhost/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  pg_data:
    name: dao64_pg_data
  uploads:
    name: dao64_uploads
  nginx_logs:
    name: dao64_nginx_logs
