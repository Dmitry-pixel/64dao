# ============================================================
# 64dao.ru — Docker Compose (production-ready)
# ============================================================
#
# Запуск:
#   docker compose up -d
#
# Остановка с удалением данных:
#   docker compose down -v
#
# Логи:
#   docker compose logs -f backend
#
# ============================================================

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: dao64_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-dao64}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS is required}
      POSTGRES_DB:       ${DB_NAME:-dao64}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
      # init-скрипты запускаются при первом создании БД
      - ./deploy/scripts/pg-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dao64} -d ${DB_NAME:-dao64}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # В production порт НЕ открываем наружу — только через internal сеть
    # Раскомментируйте только для локальной отладки:
    # ports:
    #   - "127.0.0.1:5432:5432"

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dao64_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db          # переопределяем хост для Docker-сети
      DB_PORT: "5432"
    volumes:
      - uploads:/var/www/64dao/uploads
    networks:
      - internal
    depends_on:
      db:
        condition: service_started
    # Открываем только для localhost — FastPanel nginx проксирует снаружи
    ports:
      - "127.0.0.1:8000:8000"

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://64dao.ru
    container_name: dao64_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      NODE_ENV:               production
      NEXT_PUBLIC_API_URL:    ${APP_URL:-http://localhost}/api
    networks:
      - internal
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"

  # ── Nginx Reverse Proxy (отключён — на сервере используется FastPanel nginx) ──
  # nginx:
  #   image: nginx:1.27-alpine
  #   ...закомментировано, т.к. порты 80/443 заняты fastpanel2-nginx

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  pg_data:
    name: dao64_pg_data
  uploads:
    name: dao64_uploads
  nginx_logs:
    name: dao64_nginx_logs
